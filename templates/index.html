<!DOCTYPE html>
<html>
<head>
    <title>Traffic Dashboard</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            margin: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 180px;
            box-shadow: 0 0 10px rgba(0,255,200,0.2);
        }

        .value {
            font-size: 28px;
            margin-top: 10px;
            color: #00ffcc;
        }

        img {
            margin-top: 20px;
            width: 70%;
            border-radius: 10px;
            border: 3px solid #00ffcc;
        }
    </style>
</head>
<body>

    <h1>🚦 Smart Traffic Dashboard</h1>

    <div class="container">
        <div class="card">
            <div>Total Vehicles</div>
            <div class="value" id="count">0</div>
        </div>

        <div class="card">
            <div>Density</div>
            <div class="value" id="density">LOW</div>
        </div>

        <div class="card">
            <div>Violations</div>
            <div class="value" id="violations">0</div>
        </div>

        <div class="card">
            <div>Avg Speed</div>
            <div class="value" id="speed">0 km/h</div>
        </div>
    </div>

    <img src="/video">

    <script>
        async function updateStats() {
            const res = await fetch('/stats');
            const data = await res.json();

            document.getElementById('count').innerText = data.count;
            document.getElementById('density').innerText = data.density;
            document.getElementById('violations').innerText = data.violations;
            document.getElementById('speed').innerText = data.avg_speed + " km/h";
        }

        setInterval(updateStats, 1000);
    </script>

</body>
</html>
