services:
  - type: web
    name: traffic-monitoring
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
