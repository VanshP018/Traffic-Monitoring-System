services:
  - type: web
    name: traffic-monitoring
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install "setuptools<70" wheel && pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
